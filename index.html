<script>
    async function generateVideo() {
        var topic = document.getElementById('topic').value;
        
        if (!topic) {
            alert('कृपया topic लिखें!');
            return;
        }

        document.getElementById('loading').style.display = 'block';
        document.getElementById('output').innerHTML = '';

        try {
            // यहाँ अपना Render वाला लिंक डालें (बिना आखिरी / के)
            const BACKEND_URL = "https://video-backend-c4t.onrender.com"; 
            
            // API को कॉल करें
            const response = await fetch(`${BACKEND_URL}/generate-video?topic=${encodeURIComponent(topic)}`);
            
            if (!response.ok) {
                throw new Error('Video बनाने में समस्या हुई');
            }

            const videoBlob = await response.blob();
            const videoUrl = URL.createObjectURL(videoBlob);
            
            document.getElementById('loading').style.display = 'none';
            
            var outputDiv = document.getElementById('output');
            outputDiv.innerHTML = `
                <div class="success">
                    <h3>✅ आपका वीडियो तैयार है!</h3>
                    <video controls style="width:100%; border-radius:10px; margin-top:10px;">
                        <source src="${videoUrl}" type="video/mp4">
                    </video>
                    <a href="${videoUrl}" download="video.mp4">
                        <button style="background:#28a745; margin-top:10px;">⬇️ वीडियो डाउनलोड करें</button>
                    </a>
                </div>
            `;
        } catch (error) {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('output').innerHTML = `
                <div class="error">
                    <p>❌ Error: ${error.message}</p>
                    <p>कृपया थोड़ी देर बाद फिर कोशिश करें।</p>
                </div>
            `;
        }
    }
</script>
